[pytest]
# Characterization suite for Storm-Breaker backend (NR-1/NR-2 safety net).
# Run from repo root. Re-baseline snapshots via: `pytest --update-snapshots`.
# Default behaviour (no flag): compare to frozen snapshots; FAIL on any drift.
addopts = -ra -q --strict-markers --tb=short
markers =
    char: characterization tests that freeze current response shape
    snapshot_manage: tests that capture / refresh frozen snapshots
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
